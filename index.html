      left: 0;
      width: 0;
      height: 0;

      border-right: 155px solid #f7cad0;

    /* ==========================================================================
       2. ROMANTIC AUDIO ENGINE (HTML5 Audio + Synth Fallback)
       ========================================================================== */
    const bgAudio = document.getElementById('bgAudio');

    class RomanticAudioController {
      constructor() {
        this.isPlaying = false;
        this.isMuted = false;
        this.synth = null;
      }

      start() {
        this.isPlaying = true;
        if (bgAudio) {
          bgAudio.volume = 0.6;
          const playPromise = bgAudio.play();
          if (playPromise !== undefined) {
            playPromise.catch(error => {
              console.log("HTML5 Audio blocked or offline, activating fallback synth.");
              if (window.RomanticAudioSynth) {
                this.synth = new RomanticAudioSynth();
                this.synth.start();
              }
            });
          }
        }
      }

      pause() {
        this.isPlaying = false;
        if (bgAudio) bgAudio.pause();
        if (this.synth) this.synth.pause();
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (bgAudio) bgAudio.muted = this.isMuted;
        if (this.synth) this.synth.isMuted = this.isMuted;
        return this.isMuted;
      }
    }

    class RomanticAudioSynth {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.isMuted = false;
        this.timer = null;
        this.noteIndex = 0;
        this.melodyNotes = [
          261.63, 329.63, 392.00, 493.88, 523.25,
          220.00, 261.63, 329.63, 392.00, 440.00,
          174.61, 220.00, 261.63, 329.63, 349.23,
          196.00, 246.94, 293.66, 349.23, 392.00
        ];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playNote(freq) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        const now = this.ctx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 2.5);
      }

      start() {
        this.init();
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.timer = setInterval(() => {
          if (this.isPlaying && !this.isMuted) {
            const note = this.melodyNotes[this.noteIndex % this.melodyNotes.length];
            this.playNote(note);
            if (this.noteIndex % 2 === 0) {
              setTimeout(() => this.playNote(note * 1.25), 260);
            }
            this.noteIndex++;
          }
        }, 750);
      }

      pause() {
        this.isPlaying = false;
        if (this.timer) clearInterval(this.timer);
      }
    }

    const romanticAudio = new RomanticAudioController();

    /* ==========================================================================
       3. CANVAS PARTICLES & TAP HEART EMITTER
       ========================================================================== */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(customX, customY) {
        this.reset(customX, customY);
      }

      reset(customX, customY) {
        this.x = customX !== undefined ? customX : Math.random() * canvas.width;
        this.y = customY !== undefined ? customY : canvas.height + Math.random() * 50;
        this.size = Math.random() * 12 + 6;
        this.speedY = customY !== undefined ? (Math.random() - 0.5) * 3 : Math.random() * 0.7 + 0.3;
        this.speedX = customX !== undefined ? (Math.random() - 0.5) * 3 : Math.sin(Math.random() * Math.PI) * 0.5;
        this.opacity = Math.random() * 0.6 + 0.3;
        this.type = Math.random() > 0.4 ? 'heart' : (Math.random() > 0.5 ? 'petal' : 'sparkle');
        this.color = ['#f7cad0', '#ffb3c1', '#c97a8e', '#f3e8ff', '#ffe4e1'][Math.floor(Math.random() * 5)];
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.isTemporary = customX !== undefined;
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
        this.rotation += this.rotSpeed;

        if (this.isTemporary) {
          this.opacity -= 0.012;
        } else if (this.y < -30) {
          this.reset();
        }
      }

      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;

        if (this.type === 'heart') {
          ctx.beginPath();
          const d = this.size;
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
          ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, 0);
          ctx.fill();
        } else if (this.type === 'petal') {
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size / 2, this.size, Math.PI / 4, 0, 2 * Math.PI);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 3.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    const particles = Array.from({ length: 32 }, () => new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.isTemporary && p.opacity <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* Tap/Click Burst Effect */
    window.addEventListener('click', (e) => {
      for (let i = 0; i < 6; i++) {
        particles.push(new Particle(e.clientX, e.clientY));
      }
    });

    function triggerBurst() {
      for (let i = 0; i < 35; i++) {
        particles.push(new Particle(window.innerWidth / 2, window.innerHeight / 2));
      }
    }

    /* ==========================================================================
       4. HERO ENVELOPE OPENING CONTROLLER
       ========================================================================== */
    const envelopeContainer = document.getElementById('envelopeContainer');
    const envelope = document.getElementById('envelope');
    const openLetterBtn = document.getElementById('openLetterBtn');
    const introOverlay = document.getElementById('introOverlay');
    const waxSeal = document.getElementById('waxSeal');
    const musicDisk = document.getElementById('musicDisk');
    const audioIcon = document.getElementById('audioIcon');
    const musicStatusText = document.getElementById('musicStatusText');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');

    let isOpened = false;

    function handleOpenEnvelope() {
      if (isOpened) return;
      isOpened = true;

      // Start Audio
      romanticAudio.start();
      musicDisk.classList.add('animate-spin');
      audioIcon.className = 'fa-solid fa-pause';
      musicStatusText.innerText = 'jatuh suka ♡';

      // Envelope open animations
      waxSeal.style.transform = 'translate(-50%, -50%) scale(0)';
      waxSeal.style.opacity = '0';
      envelope.classList.add('open');

      triggerBurst();

      // Transition fade to letter booklet
      setTimeout(() => {
        introOverlay.style.opacity = '0';
        setTimeout(() => {
          introOverlay.classList.add('hidden');
          renderPage(0);
        }, 950);
      }, 1300);
    }

    envelopeContainer.addEventListener('click', handleOpenEnvelope);
    openLetterBtn.addEventListener('click', handleOpenEnvelope);

    /* Audio Toggle Handler */
    toggleAudioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!romanticAudio.isPlaying) {
        romanticAudio.start();
        musicDisk.classList.add('animate-spin');
        audioIcon.className = 'fa-solid fa-pause';
        musicStatusText.innerText = 'Sempurna ♡';
      } else {
        const isMuted = romanticAudio.toggleMute();
        if (isMuted) {
          musicDisk.classList.remove('animate-spin');
          audioIcon.className = 'fa-solid fa-play';
          musicStatusText.innerText = 'Muted';
        } else {
          musicDisk.classList.add('animate-spin');
          audioIcon.className = 'fa-solid fa-pause';
          musicStatusText.innerText = 'Sempurna ♡';
        }
      }
    });

    /* ==========================================================================
       5. PAGE RENDERER & PROGRESS CONTROLLER
       ========================================================================== */
    const letterCard = document.getElementById('letterCard');
    const pageContent = document.getElementById('pageContent');
    const progressHearts = document.getElementById('progressHearts');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageCounter = document.getElementById('pageCounter');

    function renderProgressHearts() {
      progressHearts.innerHTML = '';
      pagesData.forEach((_, idx) => {
        const heartSpan = document.createElement('span');
        heartSpan.className = `transition-all duration-300 ${
          idx === currentPageIndex 
            ? 'text-deeprose scale-125 drop-shadow font-bold' 
            : 'text-softpink/60'
        }`;
        heartSpan.innerText = '♡';
        progressHearts.appendChild(heartSpan);
      });
    }

    function renderPage(index, direction = 'next') {
      const data = pagesData[index];
      
      // Card transition class setup
      letterCard.classList.remove('page-active', 'page-enter-next', 'page-enter-prev');
      letterCard.classList.add(direction === 'next' ? 'page-enter-next' : 'page-enter-prev');

      setTimeout(() => {
        pageContent.innerHTML = '';

        if (data.type === 'standard') {
          // Standard Romantic Letter Format
          const titleEl = document.createElement('h3');
          titleEl.className = "font-serif text-2xl sm:text-3xl text-deeprose font-bold mb-4 border-b border-softpink/40 pb-2";
          titleEl.innerText = data.title;
          pageContent.appendChild(titleEl);

          const bodyContainer = document.createElement('div');
          bodyContainer.className = "space-y-3.5 text-slate-700 text-base sm:text-lg leading-relaxed font-sans";

          data.paragraphs.forEach(paragraph => {
            const p = document.createElement('p');
            p.innerText = paragraph;
            bodyContainer.appendChild(p);
          });
          pageContent.appendChild(bodyContainer);

        } else if (data.type === 'scrapbook') {
          // Page 7: Cute Scrapbook / Sticky Notes Style
          const container = document.createElement('div');
          container.className = "scrapbook-texture p-4 sm:p-6 rounded-xl border-2 border-dashed border-roseaccent/40 relative shadow-inner";

          // Washi tape header
          const tape = document.createElement('div');
          tape.className = "absolute -top-3 left-1/2 transform -translate-x-1/2 washi-tape-yellow px-6 py-1 rounded text-xs font-hand text-yellow-900 font-bold rotate-1";
          tape.innerText = "Secret Note 📌";
          container.appendChild(tape);

          const titleEl = document.createElement('h3');
          titleEl.className = "font-serif text-3xl sm:text-4xl text-deeprose font-bold mb-4 text-center mt-2";
          titleEl.innerText = data.title;
          container.appendChild(titleEl);

          const p1 = document.createElement('div');
          p1.className = "bg-yellow-50 border border-yellow-200 p-3.5 rounded-lg mb-4 font-hand text-lg sm:text-xl text-slate-800 shadow-sm transform -rotate-1 relative";
          p1.innerHTML = `<span class="absolute -top-2 -left-2 text-xl">💬</span> ${data.paragraphs[0]}`;
          container.appendChild(p1);

          const p2 = document.createElement('div');
          p2.className = "bg-pink-50 border border-pink-200 p-3.5 rounded-lg font-hand text-lg sm:text-xl text-slate-800 shadow-sm transform rotate-1 relative";
          p2.innerHTML = `<span class="absolute -top-2 -right-2 text-xl">🫣</span> ${data.paragraphs[1]}`;
          container.appendChild(p2);

          const sticker1 = document.createElement('div');
          sticker1.className = "mt-4 text-right font-hand text-base text-roseaccent font-bold";
          sticker1.innerText = "~ sumpah ikhlas dari hati! 🙈✨";
          container.appendChild(sticker1);

          pageContent.appendChild(container);

        } else if (data.type === 'ending') {
          // Final Ending Page
          const titleEl = document.createElement('h3');
          titleEl.className = "font-serif text-2xl sm:text-3xl text-deeprose font-bold mb-4 text-center";
          titleEl.innerText = data.title;
          pageContent.appendChild(titleEl);

          const bodyContainer = document.createElement('div');
          bodyContainer.className = "space-y-3 text-slate-700 text-base sm:text-lg leading-relaxed font-sans text-center mb-6";

          data.paragraphs.forEach(paragraph => {
            const p = document.createElement('p');
            p.innerText = paragraph;
            bodyContainer.appendChild(p);
          });
          pageContent.appendChild(bodyContainer);

          // SVG Flower Bouquet Illustration
          const bouquetBox = document.createElement('div');
          bouquetBox.className = "flex flex-col items-center justify-center my-4";
          bouquetBox.innerHTML = `
            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-md animate-float">
              <!-- Stem & Ribbons -->
              <path d="M50 65 L45 90 M50 65 L55 90" stroke="#a8425d" stroke-width="3" stroke-linecap="round"/>
              <path d="M42 68 C48 64, 52 64, 58 68 C54 74, 46 74, 42 68 Z" fill="#f7cad0" stroke="#c97a8e"/>
              <!-- Flowers -->
              <circle cx="50" cy="45" r="14" fill="#ffb3c1"/>
              <circle cx="50" cy="45" r="8" fill="#fff0f3"/>
              <circle cx="36" cy="52" r="11" fill="#f7cad0"/>
              <circle cx="64" cy="52" r="11" fill="#f7cad0"/>
              <circle cx="40" cy="36" r="10" fill="#ffe3e8"/>
              <circle cx="60" cy="36" r="10" fill="#ffe3e8"/>
              <!-- Sparkles -->
              <circle cx="25" cy="30" r="2" fill="#c97a8e"/>
              <circle cx="75" cy="30" r="2" fill="#c97a8e"/>
              <circle cx="50" cy="20" r="3" fill="#ffb3c1"/>
            </svg>
            <p class="font-fancyhand text-2xl text-deeprose mt-2">Take care, always ♡</p>
          `;
          pageContent.appendChild(bouquetBox);

          // Read Again Button Container
          const readAgainBox = document.createElement('div');
          readAgainBox.className = "flex justify-center mt-4";
          const readAgainBtn = document.createElement('button');
          readAgainBtn.className = "bg-gradient-to-r from-softpink via-blushpink to-roseaccent text-white font-semibold text-base px-6 py-2.5 rounded-full shadow-md hover:scale-105 active:scale-95 transition border border-white flex items-center space-x-2";
          readAgainBtn.innerHTML = `<span>Read Again</span> <span class="text-lg">♡</span>`;
          readAgainBtn.addEventListener('click', () => {
            currentPageIndex = 0;
            renderPage(0, 'prev');
          });
          readAgainBox.appendChild(readAgainBtn);
          pageContent.appendChild(readAgainBox);
        }

        renderProgressHearts();
        pageCounter.innerText = `Page ${index + 1} of ${pagesData.length}`;

        prevBtn.disabled = index === 0;
        
        if (index === pagesData.length - 1) {
          nextBtn.style.display = 'none';
        } else {
          nextBtn.style.display = 'flex';
        }

        requestAnimationFrame(() => {
          letterCard.classList.remove('page-enter-next', 'page-enter-prev');
          letterCard.classList.add('page-active');
        });

      }, 200);
    }

    /* Navigation Listeners */
    prevBtn.addEventListener('click', () => {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        renderPage(currentPageIndex, 'prev');
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPageIndex < pagesData.length - 1) {
        currentPageIndex++;
        renderPage(currentPageIndex, 'next');
      }
    });

    /* Touch Swipe Support for Mobile */
    let touchStartX = 0;
    let touchEndX = 0;

    letterCard.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    letterCard.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50 && currentPageIndex < pagesData.length - 1) {
        currentPageIndex++;
        renderPage(currentPageIndex, 'next');
      } else if (touchEndX > touchStartX + 50 && currentPageIndex > 0) {
        currentPageIndex--;
        renderPage(currentPageIndex, 'prev');
      }
    }, { passive: true });
  </script>
</body>
</html>
